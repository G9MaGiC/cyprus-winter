name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-funnel-gate:
    name: Core Funnel Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The rate limiter accepts this only together with CI=true.
      E2E_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Core funnel + UX E2E gate
        run: npm run test:e2e:gate:ci

      - name: Upload core funnel Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-funnel-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: i18n validate
        run: npm run i18n:validate

      - name: i18n coverage
        # Strict since batch 69: the detector is precise (batches 67-68 took
        # the report from 2,131 false positives to a clean 0/0), so an unused
        # or missing key is now a real defect worth failing the build over.
        run: npm run i18n:coverage -- --strict

      - name: i18n hardcoded scan
        run: npm run i18n:scan -- --fail

      - name: i18n editorial drift (fr/he/ro)
        run: npm run i18n:editorial-drift

      # The committed native-review sheets (docs/i18n-review) must match the
      # catalogs. The script diffs against the pinned audit baseline
      # (main@ca827e6), so it needs real history (checkout is shallow).
      - name: i18n review sheets freshness
        run: |
          git fetch origin main --unshallow 2>/dev/null || git fetch origin main
          npm run i18n:export-review -- --check

      - name: i18n beta readiness report
        run: npm run i18n:beta-readiness

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Conflict markers
        run: npm run check:conflict-markers

      - name: Data validate
        run: npm run data:validate

      - name: Test
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e-full:
    name: E2E Full
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # The rate limiter accepts this only together with CI=true.
      E2E_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E
        run: npm run test:e2e:ci

      - name: Upload full E2E Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-e2e-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  security:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [quality, build, core-funnel-gate, e2e-full, security]
    steps:
      - name: CI passed
        run: echo "All CI jobs passed."

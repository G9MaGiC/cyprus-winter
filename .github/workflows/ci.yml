name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-funnel-gate:
    name: Core Funnel Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Core funnel + UX E2E gate
        run: npm run test:e2e:gate:ci

      - name: Upload core funnel Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-funnel-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: i18n validate
        run: npm run i18n:validate

      - name: i18n coverage
        run: npm run i18n:coverage

      - name: i18n hardcoded scan
        run: npm run i18n:scan -- --fail

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e-full:
    name: E2E Full
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E
        run: npm run test:e2e:ci

      - name: Upload full E2E Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [quality, build, core-funnel-gate, e2e-full]
    steps:
      - name: CI passed
        run: echo "All CI jobs passed."

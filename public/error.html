<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Connection issue — Cyprus Winter</title>
  <!-- System fonts only: works offline; no external requests -->
  <style>
    :root {
      --background: #faf8f5;
      --charcoal: #252730;
      --olive: #4a5162;
      --olive-muted: #6b7280;
      --terracotta: #c96f52;
      --aegean: #1a6b7c;
      --sage: #6b8f7a;
      --sand-200: #eae6df;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--charcoal);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: max(1.5rem, env(safe-area-inset-left)) max(1.5rem, env(safe-area-inset-right)) max(3rem, env(safe-area-inset-bottom));
      text-align: center;
    }
    .card {
      max-width: 20rem;
      background: white;
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 4px 24px rgba(37, 39, 48, 0.08);
      border: 1px solid var(--sand-200);
    }
    .icon {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, var(--aegean) 0%, var(--sage) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 1.5rem;
      height: 1.5rem;
      stroke: white;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--charcoal);
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    p {
      font-size: 0.9375rem;
      color: var(--olive-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      background: var(--terracotta);
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      min-height: 44px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #b85d42; }
    button:active { transform: scale(0.98); }
    .brand {
      margin-top: 2rem;
      font-size: 0.8125rem;
      color: var(--olive-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01" />
      </svg>
    </div>
    <h1>Can&rsquo;t connect</h1>
    <p>Check your connection and try again. Trails, villages, and wineries will be here when you&rsquo;re back online.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </div>
  <p class="brand">Cyprus Winter</p>
</body>
</html>
